{% load static i18n %}
<link rel="stylesheet" href="{% static 'styles/lots-map.css' %}">

<div class="map-card">
  <div class="svg-frame">
    <svg id="hacienda-map" viewBox="0 0 1500 540" class="lots-svg" aria-labelledby="title">
      <title id="title">Hacienda Residencial – Mapa general</title>

      <!-- DECOR (no interactivo) -->
      <g class="decor" pointer-events="none">
        <!-- (tu decor estático tal cual) -->
      </g>

      <!-- OVERVIEW (etapas) -->
      <g id="overview">
        <!-- (tus shapes de etapas tal cual; “Etapa 1” activa) -->
        <g id="stage-1-shape" class="stage narrow is-active" data-stage="1">
          <polygon points="1250,372 1290,372 1290,500 1250,500"/>
          <text x="1270" y="432" text-anchor="middle" dominant-baseline="middle">Etapa 1</text>
        </g>
      </g>

      <!-- OVERLAY DETALLE -->
      <g id="stage-1-overlay" visibility="hidden"></g>
    </svg>

    <!-- Leyenda -->
    <div id="legend" class="legend" hidden>
      <span class="chip chip-reserved">{% trans "Apartado" %}</span>
      <span class="chip chip-available">{% trans "Disponible" %}</span>
      <span class="chip chip-sold">{% trans "Vendido" %}</span>
    </div>

    <button id="backToOverview" class="back-btn" hidden>← {% trans "Ver todas las etapas" %}</button>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  </div>
</div>

<style>
  :root{
    --sendal-bg:#5b5747; --sendal-ink:#f4efe7;
    --lot-stroke:#234b38; --lot-available:#CFE8A6; --lot-reserved:#F5F49A; --lot-sold:#C7C7C7;
  }
  .svg-frame{position:relative;background:#4c483b;border-radius:16px;box-shadow:0 2px 0 rgba(0,0,0,.08),0 4px 18px rgba(0,0,0,.20);overflow:hidden;padding:12px}
  .lots-svg{width:100%;height:auto;display:block}
  .stage polygon,.stage path{fill:#8c8f89;stroke:#1d4b3a;stroke-width:2;vector-effect:non-scaling-stroke}
  .stage text{font:600 20px/1 Inter,system-ui;-webkit-font-smoothing:antialiased;fill:#f4efe7}
  .stage.is-inactive{opacity:.55;cursor:not-allowed}
  .stage.is-active polygon{fill:#CDE7C8}
  .stage.is-active{cursor:pointer}
  .stage.narrow text{font-size:18px}
  .tooltip{position:fixed;z-index:40;background:#111;color:#fff;font-size:13px;white-space:nowrap;padding:8px 10px;border-radius:8px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.35);transform:translate(-50%,-120%)}
  .back-btn{position:absolute;left:14px;top:14px;background:#fff;color:#333;border:none;border-radius:10px;height:36px;padding:0 12px;font-weight:700;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.18)}
  #stage-1-overlay .panel{fill:#8c8f89;stroke:#1d4b3a;stroke-width:3;vector-effect:non-scaling-stroke}
  #stage-1-overlay .lot{fill:#e9f2ee;stroke:#1d4b3a;stroke-width:2;vector-effect:non-scaling-stroke}
  #stage-1-overlay .lot:hover{filter:brightness(.98) drop-shadow(0 4px 10px rgba(0,0,0,.25))}
  .is-available{fill:var(--lot-available)!important}
  .is-reserved{fill:var(--lot-reserved)!important}
  .is-sold{fill:var(--lot-sold)!important;cursor:not-allowed;opacity:.9}
  .legend{display:flex; gap:28px; justify-content:center; align-items:center; padding:16px 0 6px;}
  .legend .chip{display:inline-flex; align-items:center; justify-content:center; min-width:170px; padding:14px 18px; border-radius:999px; font:700 20px/1.1 Inter, system-ui; color:#111; box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .chip-available{ background: var(--lot-available); }
  .chip-reserved { background: var(--lot-reserved);  }
  .chip-sold     { background: var(--lot-sold);      color:#111; }
</style>

<script>
(function(){
  const legend = document.getElementById('legend');
  const svg    = document.getElementById('hacienda-map');
  const tip    = document.getElementById('tooltip');
  const back   = document.getElementById('backToOverview');
  const overview = document.getElementById('overview');
  const overlay  = document.getElementById('stage-1-overlay');

  // Acepta cualquiera de estas variables: lots_dev_slug / development_slug / dev.slug  y lots_stage_number / stage_number / stage.number
  const endpoint = "{% url 'lots_json'
      development_slug=lots_dev_slug|default:development_slug|default:dev.slug
      stage_number=lots_stage_number|default:stage_number|default:stage.number
  %}";

  const STATUS_LABEL = { available: '{% trans "Disponible" %}', reserved: '{% trans "Apartado" %}', sold: '{% trans "Vendido" %}' };

  // Tooltip helpers
  const showTip = (e,t)=>{ tip.textContent = t; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+12)+'px'; tip.hidden=false; };
  const hideTip = ()=>{ tip.hidden = true; };

  // Dibuja detalle de etapa 1 ocupando el mapa y usando la longitud real del JSON
  function showStage1Detail(){
    overview.style.opacity = .12;
    overlay.setAttribute('visibility','visible');
    overlay.innerHTML = '';

    fetch(endpoint).then(async r=>{
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }).then(({lots=[]})=>{
      // Dimensiones del SVG (viewBox)
      const vb = svg.viewBox.baseVal;
      const PAD = 36, GAP = 8;
      const N   = Math.max(1, lots.length);

      // Panel
      const panelX = PAD, panelY = PAD;
      const panelW = vb.width  - PAD*2;
      const panelH = vb.height - PAD*2;

      const panel = document.createElementNS('http://www.w3.org/2000/svg','rect');
      panel.setAttribute('x',panelX); panel.setAttribute('y',panelY);
      panel.setAttribute('width',panelW); panel.setAttribute('height',panelH);
      panel.setAttribute('rx','16'); panel.setAttribute('class','panel');
      overlay.appendChild(panel);

      // Rejilla vertical de lotes
      const innerPad = 22;
      const innerW = panelW - innerPad*2 - GAP*(N-1);
      const innerH = panelH - innerPad*2;
      const lotW   = innerW / N;
      const x0     = panelX + innerPad;
      const y0     = panelY + innerPad;

      lots.forEach((l, i)=>{
        const x = x0 + i*(lotW+GAP);

        const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
        const id = (l.svg_id && String(l.svg_id).trim()) || `lot-auto-${i+1}`;
        rect.setAttribute('id', id);
        rect.setAttribute('x', x.toFixed(2));
        rect.setAttribute('y', y0.toFixed(2));
        rect.setAttribute('width',  lotW.toFixed(2));
        rect.setAttribute('height', innerH.toFixed(2));
        rect.setAttribute('rx','10');
        rect.setAttribute('class','lot');
        overlay.appendChild(rect);

        // Estado / accesibilidad
        rect.classList.add(`is-${l.status}`);
        rect.setAttribute('tabindex','0');
        rect.setAttribute('role','button');
        rect.dataset.status = l.status;
        rect.dataset.code   = l.code;
        rect.dataset.area   = l.area_m2;

        // Tooltip
        const txt = (l.tooltip && l.tooltip.trim()) || `Lote ${l.code}${l.area_m2 ? ' · '+l.area_m2+' m²' : ''} • ${STATUS_LABEL[l.status] || l.status}`;
        ['mouseenter','mousemove'].forEach(evt=> rect.addEventListener(evt, e=>showTip(e, txt)));
        ['mouseleave','blur'].forEach(evt=> rect.addEventListener(evt, hideTip));

        // Navegación a detalle (si procede)
        if (l.status !== 'sold' && l.url){
          rect.addEventListener('click', ()=>{ window.location.href = l.url; });
          rect.addEventListener('keydown', e=>{
            if (e.key==='Enter' || e.key===' '){ e.preventDefault(); rect.click(); }
          });
        } else {
          rect.style.cursor = 'not-allowed';
          rect.setAttribute('aria-disabled','true');
        }
      });

      back.hidden = false;
      legend.hidden = true;  // (muestra si quieres; aquí lo dejamos oculto para diseño limpio)
    }).catch(err=>{
      console.error('[lots-map] No se pudieron cargar los lotes:', err);
      overlay.innerHTML = '';
      overview.style.opacity = 1;
      hideTip();
      alert('No se pudieron cargar los lotes. Intente de nuevo.');
    });
  }

  function resetView(){
    overlay.setAttribute('visibility','hidden');
    overlay.innerHTML = '';
    overview.style.opacity = 1;
    back.hidden = true;
    legend.hidden = true;
    hideTip();
  }

  // Eventos de overview
  document.querySelectorAll('#overview .stage').forEach(st=>{
    const n = st.dataset.stage;
    const isActive = (n === '1');
    st.classList.toggle('is-active',   isActive);
    st.classList.toggle('is-inactive', !isActive);
    st.style.cursor = isActive ? 'pointer' : 'not-allowed';

    const label = 'Etapa ' + n + (isActive ? ' – Click para ver lotes' : ' – Próximamente');
    ['mouseenter','mousemove'].forEach(evt => st.addEventListener(evt, e=>showTip(e,label)));
    ['mouseleave','blur'].forEach(evt => st.addEventListener(evt, hideTip));

    if (isActive) st.addEventListener('click', showStage1Detail);
  });

  back.addEventListener('click', resetView);
})();
</script>
