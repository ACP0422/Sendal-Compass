{% load static i18n %}
<link rel="stylesheet" href="{% static 'styles/lots-map.css' %}">

<div class="map-card">
  <div class="svg-frame">
    <!-- ======== HACIENDA RESIDENCIAL (Overview + Etapa 1 lots) ======== -->
    <svg id="hacienda-map" viewBox="0 0 1500 540" class="lots-svg" aria-labelledby="title">
      <title id="title">Hacienda Residencial – Mapa general</title>

      <!-- ======= DECOR (no interactivo) ======= -->
      <g class="decor" pointer-events="none">

       

    <!-- Periférico: líneas + etiqueta tipo pill -->
    <g id="periferico" transform="translate(185,360) rotate(62)">
        <!-- barras rojas -->
        <rect x="-12" y="-230" width="10" height="330" fill="#cf2626"/>
        <rect x="  8" y="-230" width="10" height="330" fill="#cf2626"/>
    
        <!--
        <defs>
        <path id="periferico-path" d="M -20 65 L -20 -255" />
        </defs>
        <text font-size="20" font-family="Inter, system-ui" fill="#222" font-weight="600" >
        <textPath href="#periferico-path" startOffset="5%" >Periférico Valladolid</textPath>
        </text>
    -->
    </g>

            <!-- Curva negra superior -->
        <path d="M 260 245 C 510 232, 740 234, 975 246 C 1115 254, 1280 256, 1422 252"
              fill="none" stroke="#0c0c0c" stroke-width="6" stroke-linecap="round"/>

        <!-- Siembra de Agave (fluye y llega a la altura de Etapa 7) -->
        <polygon class="bg-agave"
          points="
            300,360  420,372  540,360  585,344  610,322
            610,500  488,492  370,468  286,436
          " />

        <!-- Zona Comercial (trapezio sobre Agave, DOM después para quedar encima) -->
        <polygon class="bg-commercial"
          points="
            300,418  438,458  520,476  548,410
            420,370  308,360
          " />

        <!-- Amenidades (alineada a E1/E2) -->
        <polygon class="bg-amenities" fill="#47d461"
          points="1290,372 1346,372 1362,500 1290,500" />

        <!-- Pills de texto -->
        <g class="pill-label" transform="translate(360,382)">
          <rect x="-90" y="-22" width="180" height="32" rx="10"/>
          <text text-anchor="middle" dominant-baseline="middle" y="-6">Zona Comercial</text>
        </g>
        <g class="pill-label" transform="translate(540,350)">
          <rect x="-105" y="-22" width="210" height="32" rx="10"/>
          <text text-anchor="middle" dominant-baseline="middle" y="-6">Siembra de Agave</text>
        </g>

        <g class="pill-label" transform="translate(200,310) rotate(335)">
            <rect x="-90" y="-22" width="180" height="32" rx="10"/>
            <text text-anchor="middle" dominant-baseline="middle" y="-6">Periférico</text>
          </g>


        <g class="pill-label" transform="translate(825,270)">
          <rect x="-58" y="-20" width="116" height="28" rx="8"/>
          <text text-anchor="middle" dominant-baseline="middle">Entrada</text>
        </g>
        <g class="pill-label" transform="translate(1320,358)">
          <rect x="-78" y="-22" width="156" height="32" rx="10"/>
          <text text-anchor="middle" dominant-baseline="middle" y="-6">Amenidades</text>
        </g>
      </g>

      <!-- ===== OVERVIEW (etapas) ===== -->
      <g id="overview">
        <g id="stage-7-shape" class="stage narrow is-inactive" data-stage="7">
          <polygon points="610,322 650,322 650,500 610,500"/>
          <text x="630" y="414" text-anchor="middle" dominant-baseline="middle">Etapa 7</text>
        </g>

        <g id="stage-6-shape" class="stage is-inactive" data-stage="6">
          <polygon points="655,320 770,318 770,500 655,500"/>
          <text x="712" y="414" text-anchor="middle" dominant-baseline="middle">Etapa 6</text>
        </g>

        <g id="stage-5-shape" class="stage is-inactive" data-stage="5">
          <polygon points="778,318 920,328 920,500 778,500"/>
          <text x="849" y="414" text-anchor="middle" dominant-baseline="middle">Etapa 5</text>
        </g>

        <g id="stage-4-shape" class="stage is-inactive" data-stage="4">
          <polygon points="928,328 1026,352 1026,500 928,500"/>
          <text x="977" y="424" text-anchor="middle" dominant-baseline="middle">Etapa 4</text>
        </g>

        <g id="stage-3-shape" class="stage is-inactive" data-stage="3">
          <polygon points="1034,352 1118,372 1118,500 1034,500"/>
          <text x="1076" y="432" text-anchor="middle" dominant-baseline="middle">Etapa 3</text>
        </g>

        <g id="stage-2-shape" class="stage is-inactive" data-stage="2">
          <polygon points="1126,372 1250,372 1250,500 1126,500"/>
          <text x="1188" y="436" text-anchor="middle" dominant-baseline="middle">Etapa 2</text>
        </g>

        <!-- Etapa 1 (activa) -->
        <g id="stage-1-shape" class="stage narrow is-active" data-stage="1">
          <polygon points="1250,372 1290,372 1290,500 1250,500"/>
          <text x="1270" y="432" text-anchor="middle" dominant-baseline="middle">Etapa 1</text>
        </g>
      </g>

      <!-- ===== OVERLAY DETALLE (sin zoom) ===== -->
      <g id="stage-1-overlay" visibility="hidden"></g>
    </svg>
     <!-- Leyenda (solo se muestra en vista de lotes) -->
<div id="legend" class="legend" hidden>
    <span class="chip chip-reserved">Apartado</span>
    <span class="chip chip-available">Disponible</span>
    <span class="chip chip-sold">Vendido</span>
  </div>

    <button id="backToOverview" class="back-btn" hidden>← {% trans "Ver todas las etapas" %}</button>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  </div>

 
  
</div>

<style>
  :root{
    --sendal-bg:#5b5747; --sendal-ink:#f4efe7;
    --lot-stroke:#234b38; --lot-available:#CFE8A6; --lot-reserved:#F5F49A; --lot-sold:#C7C7C7;
  }
  .svg-frame{position:relative;background:#4c483b;border-radius:16px;box-shadow:0 2px 0 rgba(0,0,0,.08),0 4px 18px rgba(0,0,0,.20);overflow:hidden;padding:12px}
  .lots-svg{width:100%;height:auto;display:block}

  .stage polygon,.stage path{fill:#8c8f89;stroke:#1d4b3a;stroke-width:2;vector-effect:non-scaling-stroke}
  .stage text{font:600 20px/1 Inter,system-ui;-webkit-font-smoothing:antialiased;fill:#f4efe7}
  .stage.is-inactive{opacity:.55;cursor:not-allowed}
  .stage.is-active polygon{fill:#CDE7C8}
  .stage.is-active{cursor:pointer}
  .stage.narrow text{font-size:18px}

  .pill-label rect{fill:#fff;opacity:.92}
  .pill-label text{fill:#222;font:700 14px/1.2 Inter,system-ui}

  .decor .bg-agave{fill:#41c95b!important;stroke:none}
  .decor .bg-commercial{fill:#26c6da!important;stroke:none}
  .decor .bg-amenities{fill:#47d461!important;stroke:none}

  .tooltip{position:fixed;z-index:40;background:#111;color:#fff;font-size:13px;white-space:nowrap;
           padding:8px 10px;border-radius:8px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.35);transform:translate(-50%,-120%)}

  .back-btn{position:absolute;left:14px;top:14px;background:#fff;color:#333;border:none;border-radius:10px;height:36px;padding:0 12px;font-weight:700;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.18)}

  /* Overlay detalle */
  #stage-1-overlay .panel{fill:#8c8f89;stroke:#1d4b3a;stroke-width:3;vector-effect:non-scaling-stroke}
  #stage-1-overlay .lot{fill:#e9f2ee;stroke:#1d4b3a;stroke-width:2;vector-effect:non-scaling-stroke}
  #stage-1-overlay .lot:hover{filter:brightness(.98) drop-shadow(0 4px 10px rgba(0,0,0,.25))}
  .is-available{fill:var(--lot-available)!important}
  .is-reserved{fill:var(--lot-reserved)!important}
  .is-sold{fill:var(--lot-sold)!important;cursor:not-allowed;opacity:.9}


  /* Leyenda en vista de lotes (overlay) */
.legend{
    display:flex; gap:28px; justify-content:center; align-items:center;
    padding:16px 0 6px;
  }
  .legend .chip{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:170px; padding:14px 18px;
    border-radius:999px; font:700 20px/1.1 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:#111; box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  
  /* Colores coherentes con los lotes */
  .chip-available{ background: var(--lot-available); }
  .chip-reserved { background: var(--lot-reserved);  }
  .chip-sold     { background: var(--lot-sold);      color:#111; }
  
</style>

<script>
    (function(){
        const legend = document.getElementById('legend');
        


      const endpoint = "{% url 'lots_json' development_slug=dev_slug stage_number=stage_number %}";
      const svg  = document.getElementById('hacienda-map');
      const tip  = document.getElementById('tooltip');
      const back = document.getElementById('backToOverview');
      const overview = document.getElementById('overview');
      const overlay  = document.getElementById('stage-1-overlay'); // <g id="stage-1-overlay" visibility="hidden"></g>
    
      const STATUS_LABEL = { available: 'Disponible', reserved: 'Apartado', sold: 'Vendido' };
    
      // Tooltip helpers
      const showTip = (e,t)=>{
        tip.textContent = t;
        tip.style.left = (e.clientX+12)+'px';
        tip.style.top  = (e.clientY+12)+'px';
        tip.hidden = false;
      };
      const hideTip = ()=>{ tip.hidden = true; };
    
      // === Dibuja el panel de Etapa 1 ocupando TODO el mapa (sin zoom)
      function showStage1Detail(){
        
        // Oculta overview visualmente y muestra overlay
        overview.style.opacity = .12;
        overlay.setAttribute('visibility','visible');
        overlay.innerHTML = '';
    
        // Dimensiones del SVG (viewBox)
        const vb = svg.viewBox.baseVal; // p.ej. 1500 x 540
        const PAD = 36;   // margen externo del panel
        const GAP = 8;    // separación entre lotes
        const N   = 9;    // número de lotes
    
        // Panel
        const panelX = PAD, panelY = PAD;
        const panelW = vb.width  - PAD*2;
        const panelH = vb.height - PAD*2;
    
        const panel = document.createElementNS('http://www.w3.org/2000/svg','rect');
        panel.setAttribute('x',panelX);
        panel.setAttribute('y',panelY);
        panel.setAttribute('width',panelW);
        panel.setAttribute('height',panelH);
        panel.setAttribute('rx','16');
        panel.setAttribute('class','panel'); // dale estilo si quieres
        overlay.appendChild(panel);
    
        // Franjas/lotes (verticales)
        const innerPad = 22;
        const innerW = panelW - innerPad*2 - GAP*(N-1);
        const innerH = panelH - innerPad*2;
        const lotW   = innerW / N;
        const x0     = panelX + innerPad;
        const y0     = panelY + innerPad;
    
        const rects = [];
        for(let i=0;i<N;i++){
          const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
          r.setAttribute('id', `lot-${i+1}`);           // intenta empatar con svg_id del backend
          r.setAttribute('x',  (x0 + i*(lotW+GAP)).toFixed(2));
          r.setAttribute('y',  y0.toFixed(2));
          r.setAttribute('width',  lotW.toFixed(2));
          r.setAttribute('height', innerH.toFixed(2));
          r.setAttribute('rx','10');
          r.setAttribute('class','lot');               // estilos base
          overlay.appendChild(r);
          rects.push(r);
        }
    
        // Trae estados y comportamientos
        fetch(endpoint)
          .then(r=>r.json())
          .then(({lots})=>{
            lots.forEach((l, i)=>{
              // 1) Busca por id exacto
              let el = l.svg_id ? document.getElementById(l.svg_id) : null;
              // 2) Si no existe o no coincide, usa el orden como respaldo
              if (!el) el = rects[i];
              if (!el) return;
    
              // Colorea por estado
              el.classList.add(`is-${l.status}`);
    
              // Accesibilidad + metadatos
              el.setAttribute('tabindex','0');
              el.setAttribute('role','button');
              el.dataset.status = l.status;
              el.dataset.code   = l.code;
              el.dataset.area   = l.area_m2;
    
              // Tooltip
              const txt = `Lote ${l.code} · ${l.area_m2} m² • ${STATUS_LABEL[l.status] || l.status}`;
              ['mouseenter','mousemove'].forEach(evt=> el.addEventListener(evt, e=>showTip(e, txt)));
              ['mouseleave','blur'].forEach(evt=> el.addEventListener(evt, hideTip));
    
              // Navegación a detalle (si no está vendido)
              if (l.status !== 'sold' && l.url){
                el.addEventListener('click', ()=>{ window.location.href = l.url; });
                el.addEventListener('keydown', e=>{
                  if (e.key==='Enter' || e.key===' '){ e.preventDefault(); el.click(); }
                });
              } else {
                el.style.cursor = 'not-allowed';
                el.setAttribute('aria-disabled','true');
              }
            });
          })
          .catch(console.error);
    

        back.hidden = false;
        legend.hidden = false;        // ✅ mostrar leyenda al entrar
      }
    
      function resetView(){
        overlay.setAttribute('visibility','hidden');
        overlay.innerHTML = '';
        overview.style.opacity = 1;
        back.hidden = true;
        legend.hidden = true;         // ✅ ocultar leyenda al salir
        hideTip();
      }
    
      // ===== Eventos de overview =====
      document.querySelectorAll('#overview .stage').forEach(st=>{
        const n = st.dataset.stage;
        const isActive = (n === '1');
        st.classList.toggle('is-active',   isActive);
        st.classList.toggle('is-inactive', !isActive);
        st.style.cursor = isActive ? 'pointer' : 'not-allowed';
    
        const label = 'Etapa ' + n + (isActive ? ' – Click para ver lotes' : ' – Próximamente');
        ['mouseenter','mousemove'].forEach(evt => st.addEventListener(evt, e=>showTip(e,label)));
        ['mouseleave','blur'].forEach(evt => st.addEventListener(evt, hideTip));
    
        if (isActive) st.addEventListener('click', showStage1Detail);
      });
    
      back.addEventListener('click', resetView);
    })();
    </script>
