
{% load static i18n %}

<link rel="stylesheet" href="{% static 'styles/cotizador.css' %}">

  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #efefef;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #svg-wrap{
      width: min(95vw, 1200px);
      height: min(80vh, 720px);  /* alto estable */
      overflow:hidden;
    }
    #svg-wrap svg{
      width:100%;
      height:100%;
      display:block;
    }
    .lot {
      fill:#A3FFB8; stroke:#222; stroke-width:1;
      vector-effect:non-scaling-stroke;
      cursor:pointer; transition:filter .15s, stroke-width .15s;
    }
    .lot:hover    { filter: brightness(.96); }
    .lot.selected { stroke:#0A8; stroke-width:3; }

    /* Colores por estado (ajusta a tus nombres) */
    .available { fill:#A3FFB8 !important; }
    .reserved  { fill:#f0d78a !important; }
    .sold      { fill:#ee0f0f !important; }
    .controls {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .controls button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
    }
    .controls button:hover { background: #f5f5f5; }


    #cancha{
        fill: #502221;
    }

    #Vector-16{
        fill:#45403D;
    }

    #Vector-14{
        fill:#4A5123;
    }
  </style>




    <div id="svg-wrap">
        <div id="svg-inline">{{ svg_markup|safe }}</div>
      </div>

      <script src="https://unpkg.com/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
      <script>
        // --- Datos desde Django ---
        const LOT_STATES = JSON.parse('{{ lot_states_json|escapejs }}');
      
        const wrap = document.getElementById('svg-wrap');
        const svg  = document.querySelector('#svg-inline svg');
      
        // Asegura props básicas del SVG
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet'); // centrado real
        if (!svg.getAttribute('viewBox')) svg.setAttribute('viewBox', '0 0 1201 559');
      
        // Toma viewBox original
        let [vx, vy, vw, vh] = svg.getAttribute('viewBox').split(/\s+/).map(Number);
      
        // (Opcional pero recomendado) tamaño intrínseco, como en tu test
        if (!svg.getAttribute('width'))  svg.setAttribute('width',  vw);
        if (!svg.getAttribute('height')) svg.setAttribute('height', vh);
      
        // Padding visual simétrico para que no “pegue” a un borde
        const PAD = Math.round(Math.max(vw, vh) * 0.02); // 2% del mayor lado
        svg.setAttribute('viewBox', `${vx - PAD} ${vy - PAD} ${vw + PAD*2} ${vh + PAD*2}`);
      
        // Clases y estados
        svg.querySelectorAll('path[id^="L-"]').forEach(p => p.classList.add('lot'));
        Object.entries(LOT_STATES).forEach(([id, st]) => {
          const el = svg.querySelector('#' + CSS.escape(id));
          if (el) el.classList.add(st);
        });
      
        // ---- Pan / Zoom ----
        let pz;
        function initPanZoom() {
          // Espera a que el contenedor tenga medidas reales
          const r = wrap.getBoundingClientRect();
          if (r.width < 10 || r.height < 10) return requestAnimationFrame(initPanZoom);
      
          if (!pz) {
            pz = svgPanZoom(svg, {
              zoomEnabled: true,
              controlIconsEnabled: true,
              fit: true,
              center: true,
              minZoom: 0.5,
              maxZoom: 20,
              zoomScaleSensitivity: 0.3
            });
          }
          // Ajuste inicial (orden importante)
          pz.updateBBox();
          pz.resize(); pz.fit(); pz.center();
        }
      
        if (document.readyState === 'complete') requestAnimationFrame(initPanZoom);
        else window.addEventListener('load', () => requestAnimationFrame(initPanZoom));
      
        // Reajustar cuando cambie el tamaño del wrap/ventana
        const ro = new ResizeObserver(() => { if (pz) { pz.updateBBox(); pz.resize(); pz.fit(); pz.center(); }});
        ro.observe(wrap);
        window.addEventListener('orientationchange', () => { if (pz) { pz.updateBBox(); pz.resize(); pz.fit(); pz.center(); }});
      
        // ---- Click en lote -> seleccionar y POST (igual que antes) ----
        function getCookie(name){
          const v=('; '+document.cookie).split('; '+name+'=');
          if (v.length===2) return v.pop().split(';').shift();
        }
        const csrftoken = getCookie('csrftoken');
      
        svg.addEventListener('click', e => {
          const t = e.target;
          if (!t.classList?.contains('lot')) return;
          svg.querySelectorAll('.lot.selected').forEach(n => n.classList.remove('selected'));
          t.classList.add('selected');
      
          fetch("{% url 'create_lead' %}", {
            method: 'POST',
            headers: {'Content-Type':'application/json','X-CSRFToken': csrftoken},
            body: JSON.stringify({ lotId: t.id, source: 'komchen_web' })
          })
          .then(r => r.json())
          .then(data => console.log('Lead creado:', data))
          .catch(err => console.error('Error creando lead:', err));
        });
      </script>
