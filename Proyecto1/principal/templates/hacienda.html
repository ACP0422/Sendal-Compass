  <style>
    html, body { height: 100%; }
    body {

      background: #efefef;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;

    #svg-wrap {
      width: min(95vw, 1400px);
      height: min(85vh, 820px);
      background: #fff;
      border: 1px solid #ddd;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    #svg-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Interacción sin alterar estilos originales */
    .lot {
      stroke: #222;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      transition: filter .15s, stroke-width .15s;
    }
    .lot:hover { filter: brightness(0.96); }
    .lot.selected { stroke: #0A8; stroke-width: 3; }


    .controls {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .controls button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,.15);
    }
    .controls button:hover { background: #f5f5f5; }
  </style>

  <div class="controls">
    <button id="zoom-in">+</button>
    <button id="zoom-out">−</button>
    <button id="reset">⟳</button>
  </div>

  <script src="https://unpkg.com/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <script>
    /* =========================
     *  Utilidades (CSRF + helper)
     * ========================= */
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }
    const CSRF = () => ({ 'X-CSRFToken': getCookie('csrftoken') });
  
    const isAdmin = new URL(location.href).searchParams.get('admin') === '1';
  
    // Config “sutil”: proyectos y etapas visibles del lado del front
    const PROJECTS = {
      komchen: { label: 'Komchén', stages: [] },                 // sin etapas
      hacienda:{ label: 'Hacienda', stages: ['Etapa 1'] }        // solo Etapa 1 habilitada
    };
  
    // Mapea ids de lote válidos (MZxx-Lxxx)
    const LOT_ID_RE = /^MZ\d{2}-L\d{3}$/i;
  
    /* =========================
     *  Pan & Zoom
     * ========================= */
    const pz = svgPanZoom('#hacienda-svg', {
      zoomEnabled: true, controlIconsEnabled: false,
      fit: true, center: true,
      minZoom: 0.5, maxZoom: 20, zoomScaleSensitivity: 0.3,
    });
    document.getElementById('zoom-in').onclick  = () => pz.zoomIn();
    document.getElementById('zoom-out').onclick = () => pz.zoomOut();
    document.getElementById('reset').onclick    = () => { pz.reset(); pz.fit(); pz.center(); };
    window.addEventListener('resize', () => { pz.resize(); pz.fit(); pz.center(); });
  
    /* =========================
     *  Marcar lotes clickables
     * ========================= */
    const svgEl = document.getElementById('hacienda-svg');
    svgEl.querySelectorAll('path[id]').forEach(el => {
      if (LOT_ID_RE.test(el.id)) el.classList.add('lot');
    });
  
    /* =========================
     *  UI mínima para ADMIN
     * ========================= */
    function ensureAdminModal() {
      if (document.getElementById('lot-admin-modal')) return;
      const modal = document.createElement('div');
      modal.id = 'lot-admin-modal';
      modal.innerHTML = `
        <style>
          #lot-admin-modal { position: fixed; inset: 0; display:none; align-items:center; justify-content:center; background: rgba(0,0,0,.45); z-index: 9999; }
          #lot-admin-card  { width: min(520px, 92vw); background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.2); font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
          #lot-admin-card h3 { margin: 0 0 10px; font-size: 18px; }
          #lot-admin-card form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
          #lot-admin-card label { font-size: 12px; color: #555; }
          #lot-admin-card input, #lot-admin-card select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
          #lot-admin-actions { margin-top: 12px; display:flex; gap: 8px; justify-content:flex-end; }
          #lot-admin-actions button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
          #lot-admin-actions button.primary { border-color:#0a8; background:#0a8; color:#fff; }
        </style>
        <div id="lot-admin-modal" role="dialog" aria-modal="true"></div>
        <div id="lot-admin-card">
          <h3>Registrar/actualizar lote en CRM</h3>
          <form id="lot-admin-form">
            <div>
              <label>Proyecto</label>
              <select name="project" id="lot-project"></select>
            </div>
            <div>
              <label>Etapa</label>
              <select name="stage" id="lot-stage"></select>
            </div>
  
            <div>
              <label>ID Lote</label>
              <input name="lot_id" id="lot-id" placeholder="MZ07-L021" required />
            </div>
            <div>
              <label>Estado</label>
              <select name="status" id="lot-status">
                <option value="available">Disponible</option>
                <option value="reserved">Apartado/Reservado</option>
                <option value="sold">Vendido</option>
              </select>
            </div>
  
            <div>
              <label>Área (m²)</label>
              <input type="number" step="0.01" name="area_m2" id="lot-area" />
            </div>
            <div>
              <label>Precio total (MXN)</label>
              <input type="number" step="0.01" name="price_total" id="lot-price" />
            </div>
  
            <div style="grid-column:1 / -1">
              <label>Imagen (URL)</label>
              <input name="image_url" id="lot-img" placeholder="https://..." />
            </div>
          </form>
          <div id="lot-admin-actions">
            <button type="button" id="lot-cancel">Cancelar</button>
            <button type="button" class="primary" id="lot-save">Guardar</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      modal.prepend(modal.lastElementChild); // overlay atrás
  
      // Rellenar selects
      const selProject = modal.querySelector('#lot-project');
      const selStage   = modal.querySelector('#lot-stage');
  
      for (const key of Object.keys(PROJECTS)) {
        const opt = document.createElement('option');
        opt.value = key; opt.textContent = PROJECTS[key].label;
        selProject.appendChild(opt);
      }
      function rebuildStages() {
        const p = selProject.value;
        selStage.innerHTML = '';
        const stages = PROJECTS[p].stages;
        if (!stages || stages.length === 0) {
          const opt = document.createElement('option');
          opt.value = ''; opt.textContent = '—';
          selStage.appendChild(opt);
        } else {
          stages.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s; opt.textContent = s;
            selStage.appendChild(opt);
          });
        }
      }
      selProject.addEventListener('change', rebuildStages);
      rebuildStages();
  
      // Eventos
      modal.querySelector('#lot-cancel').onclick = () => { modal.style.display = 'none'; };
      modal.querySelector('#lot-save').onclick = async () => {
        const f = modal.querySelector('#lot-admin-form');
        const payload = {
          project:   f.project.value,
          stage:     f.stage.value || null,
          lot_id:    f.lot_id.value.trim(),
          status:    f.status.value,
          area_m2:   f.area_m2.value ? Number(f.area_m2.value) : null,
          price_total: f.price_total.value ? Number(f.price_total.value) : null,
          image_url: f.image_url.value.trim() || null
        };
        if (!LOT_ID_RE.test(payload.lot_id)) {
          alert('ID de lote inválido. Ejemplo: MZ07-L021'); return;
        }
        try {
          const res = await fetch('/api/lot/upsert/', {
            method: 'POST',
            headers: { ...CSRF() },
            credentials: 'same-origin',
            body: (() => {
              const fd = new FormData();
              Object.entries(payload).forEach(([k,v]) => fd.append(k, v ?? ''));
              return fd;
            })()
          });
          const json = await res.json().catch(() => ({}));
          if (res.ok) {
            alert('✅ Lote guardado/actualizado en CRM');
            modal.style.display = 'none';
          } else {
            console.error(json);
            alert('⚠️ Error al guardar el lote.');
          }
        } catch (err) {
          console.error(err);
          alert('❌ No se pudo conectar con el servidor.');
        }
      };
  
      // Exponer método para abrir con datos
      modal.openFor = (lotId, projectKey='hacienda') => {
        selProject.value = projectKey;
        rebuildStages();
        modal.querySelector('#lot-id').value = lotId || '';
        modal.querySelector('#lot-status').value = 'available';
        modal.querySelector('#lot-area').value = '';
        modal.querySelector('#lot-price').value = '';
        modal.querySelector('#lot-img').value = '';
        modal.style.display = 'flex';
      };
    }
  
    /* =========================
     *  Flujo USUARIO (lead)
     * ========================= */
    async function enviarLead(lotId) {
      const fd = new FormData();
      fd.append('lot_id', lotId);
      fd.append('name', 'Visitante Web');           // sustituye por tu formulario real
      fd.append('email','lead@sendal.mx');
  
      try {
        const res  = await fetch('/api/lead/', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { ...CSRF() },   // si tu vista está csrf_exempt, puedes omitirlo
          body: fd
        });
        const json = await res.json();
        if (res.ok) {
          alert(`✅ Lote ${lotId} enviado al CRM`);
        } else {
          console.error(json);
          alert('⚠️ Error al registrar el lead.');
        }
      } catch (e) {
        console.error(e);
        alert('❌ No se pudo conectar con el servidor.');
      }
    }
  
    /* =========================
     *  Click en el SVG
     * ========================= */
    if (isAdmin) ensureAdminModal();
  
    svgEl.addEventListener('click', (e) => {
      const t = e.target;
      if (!t.classList?.contains('lot')) return;
  
      svgEl.querySelectorAll('.lot.selected').forEach(n => n.classList.remove('selected'));
      t.classList.add('selected');
  
      const lotId = t.id;
  
      if (isAdmin) {
        // Admin: abrir modal para capturar metadata del lote
        document.getElementById('lot-admin-modal').openFor(lotId, 'hacienda');
      } else {
        // Usuario: crear/actualizar lead en CRM
        enviarLead(lotId);
      }
    });
  </script>
